name: Latido

# Una vez al día hace unas consultas a Supabase para que el proyecto gratis no se pause por inactividad
# (se pausa a los 7 días sin uso). Además se vuelve a activar a sí mismo: GitHub apaga las tareas
# programadas de los repos públicos tras 60 días sin actividad.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas a Supabase
        run: |
          URL="https://ywphwooscztloyxznkuc.supabase.co/rest/v1/rpc/latido"
          KEY="sb_publishable_edUij7Uk_p7V7lOn_j9ThA_BZRKc1wo"
          for i in 1 2 3; do
            curl -fsS -X POST "$URL" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
            echo
            sleep 2
          done
      - name: Mantener activa esta tarea
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/latido.yml/enable"
